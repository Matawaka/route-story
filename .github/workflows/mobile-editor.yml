name: Mobile storyboard acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile-editor.yml'
      - 'src/storyboard-editor.ts'
      - 'src/style.css'
      - 'index.html'
      - 'tests/e2e/mobile-editor.spec.ts'
      - 'tests/e2e/storyboard.spec.ts'
      - 'scripts/acceptance/editor-package.mjs'
permissions:
  contents: read
jobs:
  touch-editor:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: msedge
      STORYBOARD_ACCEPTANCE: '1'
      UNIFIED_UX_ACCEPTANCE: '1'
      MOBILE_EDITOR_ACCEPTANCE: '1'
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run build
      - run: npx.cmd playwright install ffmpeg
      - run: npx.cmd playwright test tests/e2e/storyboard.spec.ts tests/e2e/mobile-editor.spec.ts
      - run: node scripts/acceptance/editor-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mobile-editor-evidence
          path: |
            artifacts/mobile-editor/*.png
            artifacts/mobile-editor/*.json
            artifacts/mobile-editor/*.mp4
            artifacts/montage-ci/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mobile-editor-real-recording
          path: artifacts/mobile-editor/*.webm
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: mobile-editor-candidate-bundle
          path: dist/
          retention-days: 14
