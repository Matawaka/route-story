name: MVP1.7 editor acceptance
on:
  pull_request:
    branches: [codex/interactive-storyboard-mvp17]
    paths:
      - '.github/workflows/competition.yml'
      - 'scripts/acceptance/competition-*.mjs'
      - 'tests/e2e/competition-demo.spec.ts'
      - 'tests/e2e/storyboard.spec.ts'
      - 'src/**'
      - 'index.html'
      - 'tests/e2e/storyboard-high-resolution.spec.ts'
      - 'scripts/acceptance/mvp17-production.mjs'
      - 'package*.json'
permissions:
  contents: read
jobs:
  real-interface:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: msedge
      STORYBOARD_ACCEPTANCE: '1'
      UNIFIED_UX_ACCEPTANCE: '1'
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPETITION_DEMO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run test
      - run: npm.cmd run build
      - run: npx.cmd playwright install ffmpeg
      - run: npx.cmd playwright test tests/e2e/storyboard.spec.ts tests/e2e/competition-demo.spec.ts
      - run: node scripts/acceptance/competition-media.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: competition-real-interface
          path: |
            artifacts/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: competition-jury-media
          path: |
            artifacts/competition/*.png
            artifacts/competition/edited-*.mp4
            artifacts/competition/*.gif
            artifacts/competition/*.json
          retention-days: 14
  high-resolution:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        quality: [fullhd, ultra]
        aspect: [landscape, portrait]
    env:
      PLAYWRIGHT_CHANNEL: msedge
      SWISS_BASELINE: '0'
      HIGH_RES_QUALITY: ${{ matrix.quality }}
      HIGH_RES_ASPECT: ${{ matrix.aspect }}
      MVP17_HIGH_RES: '1'
      UNIFIED_UX_ACCEPTANCE: '1'
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run build
      - run: npx.cmd playwright test tests/e2e/storyboard-high-resolution.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mvp17-${{ matrix.quality }}-${{ matrix.aspect }}
          path: |
            artifacts/
            test-results/
            artifacts-vite*.log
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mvp17-${{ matrix.quality }}-${{ matrix.aspect }}-reports
          path: artifacts/mvp17-*/**/*.json
          retention-days: 14
  public-read-only:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: msedge
      APP_URL: https://matawaka.github.io/route-story/
      EXPECTED_COMMIT: 4dd38163ec2c898db14d35fc516129b9fd4be456
      ACCEPTANCE_DIR: artifacts/public-read-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm.cmd ci
      - run: node scripts/acceptance/swiss-public.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: competition-public-read-only
          path: artifacts/
          retention-days: 14

  production-candidate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: msedge
      UNIFIED_UX_ACCEPTANCE: '1'
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm.cmd ci
      - run: npx.cmd playwright install ffmpeg
      - run: node scripts/acceptance/mvp17-production.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mvp17-production-evidence
          path: |
            artifacts/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: route-story-1.7.0-candidate
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: mvp17-production-jury-media
          path: |
            artifacts/competition/*.png
            artifacts/competition/edited-*.mp4
            artifacts/competition/*.gif
            artifacts/competition/*.json
            artifacts/mvp17-production/*.json
          retention-days: 14
