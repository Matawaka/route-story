name: Reviewed GitHub Pages release
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full reviewed main commit SHA with passing main acceptance
        required: true
        type: string
      approve_publication:
        description: Owner has explicitly authorized public publication
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.approve_publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Verify exact reviewed main and successful acceptance
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-authorization.mjs
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - name: Validate and identify public-only package
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/package-release.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages source/environment protection must be configured by the owner first.
      # No enablement token, custom domain or repository code executes in this job.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  https-acceptance:
    needs: deploy
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PLAYWRIGHT_CHANNEL: msedge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm.cmd ci
      - name: Test the actual anonymous HTTPS site and decode downloaded MP4
        env:
          APP_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/acceptance/release.mjs --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-https-acceptance
          path: artifacts/release/
          retention-days: 7
