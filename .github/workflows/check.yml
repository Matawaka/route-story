name: Route Story acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-edge:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: msedge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm.cmd ci
      # Short 4s regression and bounded 20s Standard export run on every PR.
      # Full 30s/720p benchmarks are opt-in locally: FULL_EXPORT_ACCEPTANCE=1.
      - run: npm.cmd run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: synthetic-mp4-evidence
          path: artifacts/
          retention-days: 7
